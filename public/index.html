    <!-- THE MUNSHOT DASHBOARD SDK. A CLASSIC, BLOCKING SCRIPT, IN <head>, BEFORE js/app.js.
         Every part of that sentence is load-bearing and each one fails silently if ignored:

         * CLASSIC, not type="module" — the bundle is an IIFE assigned to `var
           MunshotDashboardSDK`. Loaded this way the global is the module namespace carrying
           `createDashboardClientSdk`; loaded as a module the same name instead carries
           `{ createClient, Client }`. js/core/sdk.js probes for both, but this is the tested form.
         * NOT async or defer — js/core/sdk.js constructs the client at import time so its window
           listener is live before the host can post `host:init`, and that ordering only holds if
           the global exists before the module graph runs. A deferred SDK is a dashboard that
           renders perfectly and never receives a session token.

         Absence is a supported state, not a failure: served as a plain static site (which is how
         scripts/verify-ui.mjs drives it) there is no host, js/core/sdk.js falls back to its no-op
         client, and the dashboard paints from its committed snapshots exactly as before. -->
    <script src="https://munshot.s3.ap-south-1.amazonaws.com/SDK+script/munshot-dashboard-sdk.v1.0.0.min.js"></script>

    <script>
      // The Concall Deep Dive dashboard — a SEPARATE deployment that runs its own LLM pipeline
      // over a company's call. The Con-call tab's Deep Dive column talks to it.
      //
      // Set here rather than left to each reader's browser because that Worker has no custom
      // domain, so the address is not something anyone can guess. Reading its report index and
      // any finished report is free; STARTING a run costs real compute on their side, which is
      // why nothing in this app dispatches one without an explicit click and a confirm step.
      // `localStorage['sattva:deepdive-base']` overrides this, which is how verify-ui.mjs points
      // a whole verification run at a stub.
      //
      // Kept in its own block so an unrelated resource failure can never prevent the assignment
      // and silently send the Deep Dive column back to asking readers for a URL.
      //
      // That endpoint is unauthenticated, so this line makes it reachable by anyone who loads the
      // page. Putting auth on `POST /api/analyze` belongs on that Worker — see docs/HANDOFF.md §9.
      window.SATTVA_DEEPDIVE_URL = 'https://concall-sattva.tech-441.workers.dev';

      // The retail-chatter API, read by the Public Chatter tab. ALSO CALLED FROM THE BROWSER, and
      // for a harder reason than the one above: it is another Worker on this same Cloudflare
      // account, and Cloudflare REFUSES a Worker-to-Worker subrequest inside one zone (error 1042,
      // surfaced as a 404). A `/api/chatter` proxy was written and deployed and failed exactly that
      // way, while curl got 200 from the identical URL. See js/data/chatter-live.js.
      //
      // Safe to publish: the endpoint is public, unauthenticated, read-only and CORS-open, so there
      // is no credential here to leak and nothing a reader can spend.
      // `localStorage['sattva:chatter-base']` overrides it, which is how verify-ui.mjs points the
      // feed at a stub.
      window.SATTVA_CHATTER_URL = 'https://sentimentdash-api.tech-441.workers.dev/v1';
    </script>

    <style>
      /* ---- Design tokens. Keep every colour decision traceable to one of these. ----
         Brand ramp is indigo → purple → pink. Emerald/amber/rose are reserved strictly
         for semantic rule states (pass / partial / fail) and must never be used as brand. */
      :root {
        --brand-500: #6366f1; /* indigo — brand ramp start */
        --brand-600: #4f46e5; /* indigo-600 — links, actions, active nav */
        --brand-mid: #a855f7; /* purple — brand ramp middle */
        --brand-end: #ec4899; /* pink — brand ramp end */
        --accent-600: #4f46e5; /* indigo-600 — accent for links/actions */

        /* Semantic states — rule outcomes only, never brand. */
        --positive: #059669; /* emerald — pass */
        --caution: #d97706; /* amber — partial */
        --negative: #e11d48; /* rose — fail */
        --hard-fail: #be123c; /* rose-700 — hard fail */
        --neutral: #64748b; /* slate — n/a */

        --page-bg: #f8fafc;
        --surface: #ffffff;
        --ink-900: #0f172a;
        --ink-600: #475569;
        --ink-400: #94a3b8;
        --radius-surface: 1rem;
      }

      html {
        scroll-behavior: smooth;
        /* The closed drill panel is position:fixed and parked at translateX(100%), i.e. just
           off the right edge. `overflow-x` on <body> does not clip fixed elements, so without
           this the parked panel widens the document and the page scrolls sideways. */
        overflow-x: hidden;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink-900);
        background:
          radial-gradient(at 0% 0%, rgba(167, 139, 250, 0.12) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(244, 114, 182, 0.1) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
          #f8fafc;
        min-height: 100vh;
        /* The page body must never scroll sideways — wide tables scroll inside their own
           overflow-x container instead (see scoreTable in ui/screener.js). */
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
      }

      /* Tabular numerals — every number-bearing cell uses fixed-width digits so columns line up. */
      table tbody td,
      table thead th,
      .stat-card,
      [data-numeric] {
        font-variant-numeric: tabular-nums;
      }
      .tabular-nums,
      [class*='tabular-nums'] {
        font-variant-numeric: tabular-nums;
      }

      /* Slim scrollbars for table bodies, drill panels and dropdowns. */
      .scrollbar-thin::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fade-in 0.4s ease-out both;
      }

      /* Header refresh button, while it is checking the feeds. */
      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }
      .spin-slow {
        animation: spin-slow 0.9s linear infinite;
        transform-origin: center;
      }

      /* A single-axis strip. The underline sits INSIDE each button so it cannot create a
         second scroll axis. Native touch/trackpad scrolling stays available without tracks. */
      .tab-bar {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 6px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: var(--radius-surface);
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.025);
      }
      .tab-list {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        --fade-left: 0px;
        --fade-right: 0px;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade-left), #000 calc(100% - var(--fade-right)), transparent);
        mask-image: linear-gradient(to right, transparent, #000 var(--fade-left), #000 calc(100% - var(--fade-right)), transparent);
      }
      .tab-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
      .tab-bar[data-can-scroll-left="true"] .tab-list { --fade-left: 14px; }
      .tab-bar[data-can-scroll-right="true"] .tab-list { --fade-right: 14px; }
      .tab-btn {
        position: relative;
        flex: 0 0 auto;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 10px;
        color: var(--ink-600);
        font-size: 0.8125rem;
        font-weight: 600;
        line-height: 24px;
        white-space: nowrap;
        transition: background-color 160ms ease, color 160ms ease;
      }
      .tab-btn::after {
        content: '';
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 3px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--brand-500), var(--brand-mid));
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 200ms ease;
      }
      .tab-btn.is-active::after {
        transform: scaleX(1);
      }
      .tab-btn.is-active {
        color: var(--brand-600);
        background: #eef2ff;
      }
      .tab-scroll-controls {
        display: flex;
        flex: 0 0 auto;
        gap: 2px;
        margin-left: 6px;
        padding-left: 6px;
        border-left: 1px solid #e2e8f0;
      }
      .tab-scroll-controls[hidden] { display: none; }
      .tab-scroll-btn {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        color: var(--ink-600);
        transition: background-color 160ms ease, color 160ms ease, opacity 160ms ease;
      }
      .tab-scroll-btn svg { width: 18px; height: 18px; }
      .tab-scroll-btn:disabled { opacity: 0.3; }
      .tab-btn:focus-visible, .tab-scroll-btn:focus-visible {
        outline: 2px solid var(--brand-500);
        outline-offset: -3px;
      }
      @media (hover: hover) {
        .tab-btn:hover { color: var(--brand-600); background: #f1f5f9; }
        .tab-btn.is-active:hover { background: #e0e7ff; }
        .tab-scroll-btn:hover:not(:disabled) { color: var(--brand-600); background: #eef2ff; }
      }
      @media (max-width: 360px) {
        .tab-btn { padding-inline: 10px; font-size: 0.75rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .tab-btn, .tab-btn::after, .tab-scroll-btn { transition: none; }
      }

      /* scoreTable row numbers come from a CSS counter, not from the markup — that keeps each
         row's HTML position-independent so sorting can reorder cached strings instead of
         regenerating 500+ rows. */
      tbody {
        counter-reset: sattva-row;
      }
      tbody tr.row-line {
        counter-increment: sattva-row;
      }
      .row-rank::before {
        content: counter(sattva-row);
      }

      /* Drill-panel provenance chips use <details>; hide the default disclosure triangle
         so the summary renders as a clean chip. */
      .meta-details > summary::-webkit-details-marker { display: none; }
      .meta-details > summary { list-style: none; }
      .meta-details > summary::marker { content: ''; }

      /* Right-slide drill panel + centred modal transitions (ui/screener.js). */
      .drill-panel {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #modal-overlay.is-open {
        display: flex;
      }
      #modal-overlay.is-open #modal-container {
        opacity: 1;
        transform: scale(1);
      }

      /* Full-screen workspace overlay (ui/screener.js openWorkspace) — the Con-call Deep Dive
         lives here. Bigger than the drill panel because it carries its own tab strip. */
      #workspace-overlay.is-open {
        display: flex;
      }
      #workspace-overlay.is-open #workspace-container {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      /* Set on <body> while a workspace is open so the page behind cannot scroll. */
      body.workspace-open {
        overflow: hidden;
      }

      /* Shimmer used by the skeleton primitive. */
      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .skeleton-shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 100%);
        animation: shimmer 1.6s infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* Restrained scrollbars inside table containers and dropdowns. */
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      /* Ask Research — a fixed-height analytical workspace under the dashboard chrome. */
      .research-workspace {
        display: flex;
        height: clamp(38rem, calc(100vh - 15.25rem), 56rem);
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: 0 20px 55px -35px rgba(79, 70, 229, 0.45), 0 1px 3px rgba(15, 23, 42, 0.05);
        backdrop-filter: blur(18px);
      }
      .research-workspace-header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid #e2e8f0;
        padding: 1rem 1.25rem;
        background: linear-gradient(100deg, rgba(238, 242, 255, 0.78), rgba(250, 245, 255, 0.62) 52%, rgba(253, 242, 248, 0.55));
      }
      .research-spark {
        display: inline-flex;
        height: 2.25rem;
        width: 2.25rem;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border-radius: 0.8rem;
        color: white;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-mid) 60%, var(--brand-end));
        box-shadow: 0 8px 20px -10px rgba(99, 102, 241, 0.8);
      }
      .research-spark svg { width: 1.2rem; height: 1.2rem; }
      .research-estate-chip {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.45rem;
        border: 1px solid rgba(199, 210, 254, 0.85);
        border-radius: 9999px;
        padding: 0.4rem 0.7rem;
        background: rgba(255, 255, 255, 0.78);
        color: #4f46e5;
        font-size: 0.6875rem;
        font-weight: 700;
      }
      .research-layout {
        display: grid;
        min-height: 0;
        flex: 1 1 auto;
        grid-template-columns: 16rem minmax(0, 1fr);
      }
      .research-sidebar {
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid #e2e8f0;
        background: rgba(248, 250, 252, 0.76);
      }
      .research-new-button {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        border-radius: 0.65rem;
        padding: 0.45rem 0.65rem;
        color: white;
        background: linear-gradient(110deg, var(--brand-600), var(--brand-mid));
        font-size: 0.6875rem;
        font-weight: 800;
        box-shadow: 0 6px 16px -9px rgba(79, 70, 229, 0.9);
      }
      .research-new-button svg { width: 0.85rem; height: 0.85rem; }
      .research-session-list {
        min-height: 0;
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0.55rem;
      }
      .research-session {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 0.35rem;
        border: 1px solid transparent;
        border-radius: 0.75rem;
        padding: 0.65rem 0.55rem 0.65rem 0.7rem;
        color: #475569;
        transition: 150ms ease;
      }
      .research-session:hover { background: rgba(255, 255, 255, 0.78); color: #1e293b; }
      .research-session.is-active {
        border-color: rgba(199, 210, 254, 0.8);
        background: linear-gradient(100deg, rgba(238, 242, 255, 0.95), rgba(250, 245, 255, 0.72));
        color: #3730a3;
        box-shadow: 0 1px 2px rgba(79, 70, 229, 0.05);
      }
      .research-session-title {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        font-size: 0.75rem;
        line-height: 1.15rem;
      }
      .research-session-meta {
        display: block;
        margin-top: 0.15rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.625rem;
        color: #94a3b8;
      }
      .research-session-delete {
        display: inline-flex;
        height: 1.75rem;
        width: 1.75rem;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border-radius: 0.55rem;
        color: #94a3b8;
        opacity: 0;
        transition: 150ms ease;
      }
      .research-session:hover .research-session-delete,
      .research-session-delete:focus { opacity: 1; }
      .research-session-delete:hover { background: #fff1f2; color: #e11d48; }
      .research-session-delete[aria-disabled='true'] { cursor: not-allowed; opacity: 0.35; }
      .research-session-delete svg { width: 0.9rem; height: 0.9rem; }
      .research-thread { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: rgba(255, 255, 255, 0.66); }
      .research-transcript { min-height: 0; flex: 1 1 auto; overflow-y: auto; overflow-anchor: none; padding: 1.5rem clamp(1rem, 3vw, 2.5rem); }
      .research-opening { max-width: 54rem; margin: 0 auto; padding: clamp(1rem, 4vh, 3.25rem) 0 2rem; text-align: center; }
      .research-opening-icon {
        display: inline-flex;
        height: 3.4rem;
        width: 3.4rem;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(199, 210, 254, 0.8);
        border-radius: 1.1rem;
        color: #6366f1;
        background: linear-gradient(135deg, #eef2ff, #faf5ff 55%, #fdf2f8);
        box-shadow: 0 14px 30px -20px rgba(99, 102, 241, 0.8);
      }
      .research-opening-icon svg { width: 1.6rem; height: 1.6rem; }
      .research-opening-promises { display: grid; margin-top: 1.35rem; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem; text-align: left; }
      .research-promise { display: flex; align-items: flex-start; gap: 0.5rem; border: 1px solid #f1f5f9; border-radius: 0.75rem; padding: 0.65rem; background: rgba(248, 250, 252, 0.72); }
      .research-promise-dot { width: 0.42rem; height: 0.42rem; flex: 0 0 auto; margin-top: 0.25rem; border-radius: 9999px; background: linear-gradient(135deg, var(--brand-500), var(--brand-mid)); }
      .research-suggestions { display: grid; margin-top: 0.6rem; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; text-align: left; }
      .research-suggestion { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 0.8rem; border: 1px solid #e2e8f0; border-radius: 0.85rem; padding: 0.75rem 0.85rem; background: white; color: #475569; font-size: 0.75rem; font-weight: 600; line-height: 1.1rem; transition: 150ms ease; }
      .research-suggestion:hover { border-color: #c7d2fe; color: #4338ca; box-shadow: 0 7px 20px -16px rgba(79, 70, 229, 0.9); transform: translateY(-1px); }
      .research-suggestion svg { width: 0.9rem; height: 0.9rem; flex: 0 0 auto; color: #a5b4fc; }
      .research-message-stack { width: min(100%, 58rem); margin: 0 auto; }
      .research-user-row { display: flex; justify-content: flex-end; margin: 0 0 1.25rem; }
      .research-user-bubble { max-width: min(75%, 38rem); border-radius: 1rem 1rem 0.3rem 1rem; padding: 0.7rem 0.95rem; background: linear-gradient(115deg, #4f46e5, #7c3aed); color: white; font-size: 0.8125rem; line-height: 1.35rem; box-shadow: 0 10px 25px -18px rgba(79, 70, 229, 0.9); white-space: pre-wrap; }
      .research-assistant-answer { margin: 0 0 1.75rem; padding-left: 1rem; border-left: 2px solid rgba(99, 102, 241, 0.35); }
      .research-assistant-answer.is-streaming { border-left-color: rgba(168, 85, 247, 0.42); }
      .research-answer-label { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; color: #6366f1; font-size: 0.625rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
      .research-mini-spark { font-size: 0.75rem; }
      .research-live-dot { width: 0.4rem; height: 0.4rem; border-radius: 9999px; background: #a855f7; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1); animation: research-pulse 1.4s ease-in-out infinite; }
      @keyframes research-pulse { 50% { opacity: 0.38; transform: scale(0.72); } }
      .research-answer-body { max-width: 50rem; color: #334155; font-size: 0.8125rem; line-height: 1.45rem; }
      .research-answer-paragraph { margin-top: 0.65rem; }
      .research-answer-paragraph:first-child { margin-top: 0; border-radius: 0 0.65rem 0.65rem 0; background: linear-gradient(90deg, rgba(238, 242, 255, 0.75), transparent 86%); padding: 0.55rem 0.75rem; color: #1e293b; }
      .research-answer-heading { margin-top: 1.15rem; color: #0f172a; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 0.875rem; font-weight: 800; }
      .research-answer-callout { margin-top: 0.85rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; background: #f8fafc; padding: 0.7rem 0.85rem; color: #475569; }
      .research-answer-list { margin-top: 0.7rem; padding-left: 1.2rem; }
      .research-answer-list li { margin-top: 0.25rem; padding-left: 0.15rem; }
      .research-thinking { display: flex; align-items: center; gap: 0.25rem; color: #64748b; font-size: 0.75rem; }
      .research-thinking > span { width: 0.3rem; height: 0.3rem; border-radius: 9999px; background: #a5b4fc; animation: research-bounce 1s ease-in-out infinite; }
      .research-thinking > span:nth-child(2) { animation-delay: 120ms; }
      .research-thinking > span:nth-child(3) { animation-delay: 240ms; margin-right: 0.35rem; }
      @keyframes research-bounce { 50% { transform: translateY(-3px); opacity: 0.45; } }
      .research-sources { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-top: 0.85rem; }
      .research-source-chip { display: inline-flex; max-width: 13rem; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid #e2e8f0; border-radius: 9999px; padding: 0.25rem 0.5rem; background: #f8fafc; color: #64748b; font-size: 0.625rem; font-weight: 700; transition: 150ms ease; }
      .research-source-chip:hover { border-color: #c7d2fe; background: #eef2ff; color: #4f46e5; }
      .research-source-chip-web { border-color: #e9d5ff; background: #faf5ff; color: #7e22ce; }
      .research-cite { display: inline-flex; align-items: center; gap: 0.2rem; margin: 0 0.1rem; border: 1px solid #c7d2fe; border-radius: 9999px; padding: 0.05rem 0.5rem; background: #eef2ff; color: #4f46e5; font-size: 0.72em; font-weight: 700; line-height: 1.4; text-decoration: none; vertical-align: baseline; white-space: nowrap; transition: 150ms ease; }
      .research-cite::after { content: '↗'; font-size: 0.85em; opacity: 0.7; }
      .research-cite:hover { border-color: #818cf8; background: #e0e7ff; color: #3730a3; }
      .research-cite:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
      .research-cite-unresolved { border-style: dashed; color: #64748b; background: #f8fafc; border-color: #e2e8f0; }
      .research-cite-unresolved::after { content: none; }
      .research-composer-wrap { flex: 0 0 auto; border-top: 1px solid #e2e8f0; padding: 0.7rem clamp(1rem, 3vw, 2.5rem) 0.65rem; background: rgba(255, 255, 255, 0.9); }
      .research-config-notice { width: min(100%, 58rem); margin: 0 auto 0.45rem; border: 1px solid #fde68a; border-radius: 0.65rem; padding: 0.45rem 0.65rem; background: #fffbeb; color: #92400e; font-size: 0.6875rem; }
      .research-phase { width: min(100%, 58rem); margin: 0 auto 0.2rem; color: #64748b; font-size: 0.625rem; font-weight: 600; }
      .research-composer { width: min(100%, 58rem); margin: 0 auto; border: 1px solid #cbd5e1; border-radius: 1rem; background: white; box-shadow: 0 12px 35px -28px rgba(15, 23, 42, 0.45); transition: 150ms ease; }
      .research-composer:focus-within { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1), 0 14px 35px -28px rgba(79, 70, 229, 0.7); }
      .research-composer.is-disabled { background: #f8fafc; }
      .research-composer textarea { display: block; width: 100%; resize: none; overflow-y: auto; border: 0; border-radius: 1rem 1rem 0 0; padding: 0.75rem 0.9rem 0.35rem; background: transparent; color: #1e293b; font-size: 0.8125rem; line-height: 1.35rem; outline: none; }
      .research-composer textarea::placeholder { color: #94a3b8; }
      .research-composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.35rem 0.45rem 0.45rem 0.55rem; }
      .research-web-button { display: inline-flex; min-width: 0; align-items: center; gap: 0.5rem; border-radius: 0.7rem; padding: 0.3rem 0.45rem; color: #64748b; text-align: left; transition: 150ms ease; }
      .research-web-button:hover:not(:disabled) { background: #f8fafc; color: #4f46e5; }
      .research-web-button.is-active { background: linear-gradient(100deg, #eef2ff, #faf5ff); color: #4f46e5; }
      .research-web-button svg { width: 1rem; height: 1rem; flex: 0 0 auto; }
      .research-web-button span { min-width: 0; }
      .research-web-button strong { display: block; font-size: 0.6875rem; line-height: 0.9rem; }
      .research-web-button small { display: block; margin-top: 0.05rem; color: #94a3b8; font-size: 0.5625rem; line-height: 0.75rem; }
      .research-send-button { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 0.4rem; border-radius: 0.7rem; padding: 0.5rem 0.75rem; color: white; background: linear-gradient(110deg, var(--brand-600), var(--brand-mid)); font-size: 0.6875rem; font-weight: 800; box-shadow: 0 7px 18px -12px rgba(79, 70, 229, 0.95); transition: 150ms ease; }
      .research-send-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 9px 21px -12px rgba(79, 70, 229, 1); }
      .research-send-button:disabled { cursor: not-allowed; opacity: 0.38; box-shadow: none; }
      .research-send-button svg { width: 0.9rem; height: 0.9rem; }
      .research-new-button:focus-visible,
      .research-session > button:first-child:focus-visible,
      .research-session-delete:focus-visible,
      .research-suggestion:focus-visible,
      .research-web-button:focus-visible,
      .research-send-button:focus-visible,
      .research-source-chip:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }

      @media (max-width: 820px) {
        .research-workspace { height: auto; min-height: 44rem; }
        .research-workspace-header { align-items: flex-start; }
        .research-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: 11rem minmax(34rem, 65vh); }
        .research-sidebar { border-right: 0; border-bottom: 1px solid #e2e8f0; }
        .research-session-list { display: flex; gap: 0.4rem; overflow-x: auto; overflow-y: hidden; }
        .research-session { width: 12rem; flex: 0 0 auto; }
        .research-sidebar > :last-child { display: none; }
        .research-opening { padding-top: 1.25rem; }
      }

      @media (max-width: 560px) {
        .research-workspace-header { padding: 0.85rem; }
        .research-estate-chip { display: none; }
        .research-layout { grid-template-rows: 10rem minmax(35rem, 68vh); }
        .research-transcript { padding: 1rem 0.8rem; }
        .research-opening-promises { grid-template-columns: minmax(0, 1fr); }
        .research-suggestions { grid-template-columns: minmax(0, 1fr); }
        .research-user-bubble { max-width: 88%; }
        .research-assistant-answer { padding-left: 0.7rem; }
        .research-composer-wrap { padding: 0.6rem 0.7rem; }
        .research-web-button small { display: none; }
        .research-send-button span { display: none; }
        .research-send-button { padding: 0.55rem 0.65rem; }
      }

      /* ---- Source beacon (ui/source-beacon.js) — the lower-left "data flowing in" widget. ----
         Written as its own classes rather than as utilities because it is one self-contained
         component with a diagram in it, and because the animations below want to live beside the
         geometry they animate. The global prefers-reduced-motion block further down turns every
         one of them off; the SVG motes are SMIL and CSS cannot reach them, so source-beacon.js
         drops those in JS instead.

         z-index 30 matches the alert stack: under the drill (40/50), the workspace (55) and
         modals (60), all of which the reader opened deliberately. It is declared BEFORE
         #notification-root in the body so a toast wins the corner on a narrow screen. */
      .beacon-root {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.55rem;
        pointer-events: none;
      }
      .beacon-root > * { pointer-events: auto; }

      /* The Sattva square: the same brand ramp as the header logo, because it is the same mark —
         that is what makes the diagram legible as "into THIS dashboard". */
      .beacon-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 1.6rem;
        width: 1.6rem;
        flex: 0 0 auto;
        border-radius: 0.5rem;
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #fff;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-mid) 55%, var(--brand-end));
        box-shadow: 0 6px 16px -8px rgba(99, 102, 241, 0.9);
      }
      .beacon-mark-lg {
        height: 2.4rem;
        width: 2.4rem;
        border-radius: 0.8rem;
        font-size: 0.82rem;
        box-shadow: 0 10px 26px -10px rgba(99, 102, 241, 0.95), 0 0 0 4px rgba(255, 255, 255, 0.9);
      }

      /* The green dot. Emerald is semantic on this dashboard and here it means one thing: feeds
         that refresh on their own. The pill beside it says how many, never a bare "Live". */
      .beacon-live-dot {
        position: relative;
        display: inline-block;
        height: 0.44rem;
        width: 0.44rem;
        flex: 0 0 auto;
        border-radius: 9999px;
        background: var(--positive);
      }
      .beacon-live-dot::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: var(--positive);
        animation: beacon-ping 1.9s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .beacon-live-dot-sm { height: 0.38rem; width: 0.38rem; }

      .beacon-launcher {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.3rem 0.7rem 0.3rem 0.32rem;
        border: 0;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 0 0 rgba(226, 232, 240, 0.9) inset, 0 0 0 1px rgba(226, 232, 240, 0.95),
          0 14px 34px -22px rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(10px);
        cursor: pointer;
        transition: box-shadow 180ms ease, transform 180ms ease;
      }
      .beacon-launcher:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 0 1px rgba(199, 210, 254, 0.95), 0 18px 38px -20px rgba(79, 70, 229, 0.55);
      }
      .beacon-launcher:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }
      .beacon-launcher-text { display: flex; flex-direction: column; text-align: left; line-height: 1.15; }
      .beacon-launcher-line { font-size: 0.6875rem; font-weight: 700; color: #334155; font-variant-numeric: tabular-nums; }
      .beacon-launcher-sub {
        font-size: 0.5625rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #94a3b8;
        font-variant-numeric: tabular-nums;
      }

      .beacon-panel {
        display: flex;
        flex-direction: column;
        width: min(27rem, calc(100vw - 2rem));
        max-height: min(32rem, calc(100vh - 6.5rem));
        overflow: hidden;
        border-radius: 1.15rem;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(226, 232, 240, 0.95), 0 30px 60px -30px rgba(15, 23, 42, 0.55);
        transform-origin: bottom left;
        animation: beacon-in 220ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
      }
      .beacon-panel:focus { outline: none; }
      .beacon-panel-head {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 0.8rem;
        border-bottom: 1px solid #e2e8f0;
        background: linear-gradient(100deg, rgba(238, 242, 255, 0.9), rgba(250, 245, 255, 0.7) 55%, rgba(253, 242, 248, 0.6));
      }
      .beacon-panel-titles { min-width: 0; flex: 1 1 auto; }
      .beacon-panel-title {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
        font-size: 0.85rem;
        font-weight: 800;
        line-height: 1.1;
        color: var(--ink-900);
      }
      .beacon-panel-sub {
        margin-top: 0.1rem;
        font-size: 0.625rem;
        line-height: 1.25;
        color: #64748b;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .beacon-live-pill {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.3rem;
        padding: 0.2rem 0.45rem;
        border-radius: 9999px;
        background: #ecfdf5;
        box-shadow: 0 0 0 1px rgba(167, 243, 208, 0.9);
        color: #047857;
        font-size: 0.625rem;
        font-weight: 800;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .beacon-close {
        flex: 0 0 auto;
        border: 0;
        background: none;
        padding: 0 0.1rem;
        font-size: 1.15rem;
        line-height: 1;
        color: #94a3b8;
        cursor: pointer;
      }
      .beacon-close:hover { color: #334155; }

      .beacon-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 8.75rem;
        min-height: 0;
        flex: 1 1 auto;
      }
      .beacon-list { min-height: 0; overflow-y: auto; padding: 0.5rem 0.35rem 0.65rem 0.6rem; }
      .beacon-list:focus-visible { outline: 2px solid var(--brand-600); outline-offset: -2px; }
      .beacon-group + .beacon-group { margin-top: 0.5rem; }
      .beacon-group-head { display: flex; align-items: center; gap: 0.3rem; }
      .beacon-group-icon { font-size: 0.7rem; line-height: 1; }
      .beacon-group-title {
        font-size: 0.5625rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4338ca;
      }
      .beacon-group-count {
        padding: 0 0.28rem;
        border-radius: 9999px;
        background: #f1f5f9;
        color: #94a3b8;
        font-size: 0.5625rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .beacon-group-tabs {
        margin: 0.05rem 0 0.15rem 1rem;
        font-size: 0.5625rem;
        color: #cbd5e1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .beacon-row {
        display: grid;
        grid-template-columns: 0.5rem minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 0.4rem;
        padding: 0.13rem 0.3rem;
        border-radius: 0.4rem;
      }
      .beacon-row:hover { background: #f8fafc; }
      /* Wraps rather than truncates. Thirty-odd rows scroll either way, and a clipped source name
         in the one panel whose whole job is naming sources is the thing it must not do. */
      .beacon-row-name {
        font-size: 0.65rem;
        font-weight: 600;
        line-height: 1.3;
        color: #475569;
        overflow-wrap: anywhere;
      }
      .beacon-row:hover .beacon-row-name { color: var(--ink-900); }
      /* Only the exceptions are labelled. Live is the majority and its dot, the pill above and the
         legend below all say so; what a reader must never mistake is the mock, the manual and the
         nothing-flows-until-you-ask, so those carry the word. */
      .beacon-row-status {
        font-size: 0.5rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .beacon-row.is-live .beacon-row-status { display: none; }

      .beacon-dot {
        height: 0.5rem;
        width: 0.5rem;
        align-self: center;
        border-radius: 9999px;
        background: var(--beacon-dot-color, #94a3b8);
      }
      .beacon-dot-static { height: 0.4rem; width: 0.4rem; animation: none !important; }
      .is-live { --beacon-dot-color: var(--positive); }
      .is-static { --beacon-dot-color: #3b82f6; }
      .is-ondemand { --beacon-dot-color: var(--brand-500); }
      .is-mock { --beacon-dot-color: var(--caution); }
      .is-unreadable { --beacon-dot-color: var(--negative); }
      .is-pending { --beacon-dot-color: #94a3b8; }
      .is-live .beacon-row-status, .is-live.beacon-legend-item { color: #047857; }
      .is-static .beacon-row-status, .is-static.beacon-legend-item { color: #1d4ed8; }
      .is-ondemand .beacon-row-status, .is-ondemand.beacon-legend-item { color: var(--brand-600); }
      .is-mock .beacon-row-status, .is-mock.beacon-legend-item { color: #b45309; }
      .is-unreadable .beacon-row-status, .is-unreadable.beacon-legend-item { color: #be123c; }
      .is-pending .beacon-row-status, .is-pending.beacon-legend-item { color: #94a3b8; }

      /* An editable family's control, in its own heading. Only Twitter / X has one. */
      .beacon-group-action {
        margin-left: auto;
        border: 0;
        border-radius: 9999px;
        background: #eef2ff;
        padding: 0.1rem 0.45rem;
        color: var(--brand-600);
        font-size: 0.5625rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 140ms ease;
      }
      .beacon-group-action:hover { background: #e0e7ff; }
      .beacon-group-action:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 1px; }
      /* Live rows breathe on a stagger so the column reads as many independent feeds rather than
         one blinking block. Box-shadow only — no layout, no paint outside the row. */
      .beacon-row.is-live .beacon-dot { animation: beacon-dot-pulse 2.6s ease-in-out infinite; }

      /* The convergence diagram. Drawn 1:1 (no stretching) so the curves are not sheared and every
         line carries the same weight; the rail's dashed left border is the bus the list feeds. */
      .beacon-flow {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        overflow: hidden;
        border-left: 1px dashed #e2e8f0;
        background: linear-gradient(180deg, rgba(248, 250, 252, 0.4), rgba(238, 242, 255, 0.55));
      }
      .beacon-flow-stage { position: relative; flex: 0 0 auto; }
      .beacon-flow-svg { display: block; overflow: visible; }
      .beacon-flow-bed path { fill: none; stroke: #e2e8f0; stroke-width: 1; }
      .beacon-flow-line {
        fill: none;
        stroke: url(#beacon-flow-grad);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-dasharray: 2.5 8.5;
        animation: beacon-flow 1.4s linear infinite;
      }
      .beacon-flow-mote { fill: var(--brand-600); filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.85)); }
      .beacon-flow-icon { font-size: 11px; transition: font-size 140ms ease; }

      /* Family pairing: hover a group in the list and its own wire lights while the rest dim.
         That is what makes the diagram answer a question rather than only decorate one. */
      .beacon-flow-stage.is-focused .beacon-flow-line { opacity: 0.22; }
      .beacon-flow-stage.is-focused .beacon-flow-icon { opacity: 0.3; }
      .beacon-flow-line.is-hot {
        opacity: 1 !important;
        stroke-width: 2.7;
        filter: drop-shadow(0 0 3px rgba(99, 102, 241, 0.65));
      }
      .beacon-flow-icon.is-hot { opacity: 1 !important; font-size: 14px; }
      .beacon-group.is-hot .beacon-group-title { color: var(--brand-end); }
      .beacon-core {
        position: absolute;
        left: var(--beacon-join-x, 70%);
        top: var(--beacon-join-y, 50%);
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .beacon-core-halo {
        position: absolute;
        height: 2.4rem;
        width: 2.4rem;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.45), rgba(168, 85, 247, 0));
        animation: beacon-halo 2.8s ease-out infinite;
      }
      .beacon-core-halo-2 { animation-delay: 1.4s; }
      .beacon-flow-caption { text-align: center; padding: 0 0.35rem; }
      .beacon-flow-title {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
        font-size: 0.625rem;
        font-weight: 800;
        color: #334155;
      }
      .beacon-flow-sub { font-size: 0.5625rem; color: #94a3b8; font-variant-numeric: tabular-nums; }

      .beacon-panel-foot {
        flex: 0 0 auto;
        padding: 0.45rem 0.8rem 0.55rem;
        border-top: 1px solid #e2e8f0;
        background: rgba(248, 250, 252, 0.75);
      }
      .beacon-legend { display: flex; flex-wrap: wrap; gap: 0.25rem 0.6rem; }
      .beacon-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.5625rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .beacon-foot-note { margin-top: 0.25rem; font-size: 0.5rem; color: #94a3b8; }
      .beacon-foot-note code { border-radius: 0.2rem; background: #f1f5f9; padding: 0 0.2rem; }

      @keyframes beacon-in {
        from { opacity: 0; transform: translateY(10px) scale(0.96); }
        to { opacity: 1; transform: none; }
      }
      @keyframes beacon-ping {
        0% { transform: scale(1); opacity: 0.65; }
        70%, 100% { transform: scale(2.4); opacity: 0; }
      }
      @keyframes beacon-dot-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.45); }
        50% { box-shadow: 0 0 0 3px rgba(5, 150, 105, 0); }
      }
      @keyframes beacon-halo {
        0% { transform: scale(0.7); opacity: 0.55; }
        70%, 100% { transform: scale(1.95); opacity: 0; }
      }
      /* Dashes travel from the far end of each wire into the core. */
      @keyframes beacon-flow {
        to { stroke-dashoffset: -11; }
      }

      /* Very narrow viewports: the launcher stays, the panel keeps its diagram but gives the list
         everything else. Hiding the diagram here would remove the one thing the widget is for. */
      @media (max-width: 420px) {
        /* The rail narrows and the diagram scales to match. A uniform transform rather than a
           narrower viewBox: cropping the stage with overflow would cut the icons off the left of
           the wires, which are the half that says WHICH family each one is. */
        .beacon-body { grid-template-columns: minmax(0, 1fr) 7.5rem; }
        .beacon-flow-stage { transform: scale(0.85); }
        .beacon-flow-caption { padding: 0 0.15rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

  <body class="text-slate-800">
    <div id="app">
      <!-- Shell (header, rail, tabs, content host) is mounted by js/ui/shell.js. -->
      <div class="mx-auto max-w-lg px-6 py-24 text-center text-sm text-slate-400">Loading Sattva Central Research…</div>
    </div>

    <!-- Overlay layer, owned by ui/screener.js. Both are singletons: any tab can open the
         right-slide drill panel or the centred modal without mounting its own copy. -->
    <div id="drill-overlay" class="fixed inset-0 z-40 hidden bg-slate-900/30 backdrop-blur-sm"></div>
    <aside
      id="drill-panel"
      class="drill-panel scrollbar-thin fixed right-0 top-0 z-50 h-full w-full translate-x-full overflow-y-auto bg-white shadow-2xl sm:w-[480px]"
    >
      <div id="drill-content"></div>
    </aside>

    <div
      id="modal-overlay"
      class="fixed inset-0 z-[60] hidden items-center justify-center overflow-y-auto bg-slate-900/60 p-4 backdrop-blur-sm sm:p-8"
    >
      <div id="modal-container" class="relative my-8 w-full max-w-4xl scale-95 overflow-hidden rounded-3xl bg-white opacity-0 shadow-2xl transition-all duration-200">
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- Full-screen workspace overlay, owned by ui/screener.js.
         Stacking order is deliberate: drill (z-50) < workspace (z-55) < modal (z-60), so the
         keyword editor — a modal opened from inside the Deep Dive — lands on top of it rather
         than behind it. -->
    <div
      id="workspace-overlay"
      class="fixed inset-0 z-[55] hidden items-start justify-center overflow-y-auto bg-slate-900/70 p-0 backdrop-blur-sm sm:p-6"
    >
      <div
        id="workspace-container"
        class="relative w-full max-w-[1200px] translate-y-4 scale-[0.98] overflow-hidden rounded-none bg-white opacity-0 shadow-2xl transition-all duration-200 sm:my-4 sm:rounded-3xl"
      >
        <div id="workspace-content"></div>
      </div>
    </div>

    <!-- "Data flowing in" — the lower-left source beacon, owned by ui/source-beacon.js, which
         creates this node if it is absent. Declared BEFORE the alert stack so that on a narrow
         screen, where the two corners meet, a toast paints over the beacon rather than under it:
         an alert is a fact that just arrived and this is a reference panel. -->
    <div id="source-beacon-root" class="beacon-root"></div>

    <!-- Live alert stack, owned by ui/notifications.js, which creates this node if it is absent.
         z-30 is deliberate and sits BELOW every overlay above: a toast announcing a result must
         never land on top of a drill panel or a workspace the reader opened on purpose. -->
    <div
      id="notification-root"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed bottom-4 right-4 z-30 flex w-[min(22rem,calc(100vw-2rem))] flex-col-reverse gap-2"
    ></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
