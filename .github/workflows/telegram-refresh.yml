name: Telegram collection

on:
  schedule:
    # Best effort. Active readers also request overdue checks through the existing POST route.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Older messages/IDs to collect this run (0 disables history)'
        required: false
        default: '180'
      resume_api:
        description: 'Resume API collection once after reviewing a pause (operator only)'
        type: boolean
        default: false
      head_hint:
        description: 'Optional verified message number for the public-page fallback'
        required: false
        default: '0'
      source:
        description: 'Who requested this run'
        required: false
        default: 'manual'

run-name: Telegram collection (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})
concurrency:
  group: telegram-account-collection
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore retained collection independently of archive PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/telegram-artifact.mjs restore public/data/telegram-posts.json "$RUNNER_TEMP/telegram-posts.json"
      - name: Detect official API connection
        id: connection
        env:
          TELEGRAM_CREDENTIALS: ${{ secrets.TELEGRAM_CREDENTIALS }}
        run: |
          if [ -n "$TELEGRAM_CREDENTIALS" ]; then
            echo 'api=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.connection.outputs.api == 'true'
        with:
          python-version: '3.12'
      - name: Install official API client outside the repository
        if: steps.connection.outputs.api == 'true'
        run: pip install --disable-pip-version-check telethon==1.44.0
      - name: Collect channel through official API or public fallback
        id: collect
        continue-on-error: true
        env:
          TELEGRAM_CREDENTIALS: ${{ secrets.TELEGRAM_CREDENTIALS }}
          TELEGRAM_API_REVIEWED_RESUME: ${{ inputs.resume_api == true && '1' || '0' }}
          TELEGRAM_OUT: ${{ runner.temp }}/telegram-posts.json
          TELEGRAM_BACKFILL: ${{ inputs.backfill || '180' }}
          TELEGRAM_HEAD_HINT: ${{ inputs.head_hint || '0' }}
        run: |
          if [ -n "$TELEGRAM_CREDENTIALS" ]; then
            python scripts/collect-telegram.py
          else
            node scripts/scrape-telegram.mjs
          fi
      - name: Preserve a failed source check explicitly
        if: steps.collect.outcome == 'failure'
        run: node scripts/telegram-artifact.mjs failed "$RUNNER_TEMP/telegram-posts.json"
      - name: Validate and package only public channel data
        run: node scripts/telegram-artifact.mjs pack "$RUNNER_TEMP/telegram-posts.json" "$RUNNER_TEMP/telegram-posts-v1.json.gz"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/telegram-posts-v1.json.gz
          archive: false
          if-no-files-found: error
          retention-days: 90
      # Publish a health record even after source failure. The UI reads lastRun, never equates
      # workflow success with source success; the error is explicit in the run summary.
      - name: Collection health
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Telegram source failed. Prior posts and failed health were retained in the artifact.'
