name: Telegram archive

on:
  schedule:
    # Best-effort scheduling; the UI reports the actual successful check time.
    - cron: "33 2 * * *"
  workflow_dispatch:

run-name: Telegram archive

concurrency:
  group: telegram-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for an existing archive PR to be resolved
        id: existing
        run: |
          number=$(gh pr list --head codex/telegram-capture --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "Archive PR #$number is awaiting checks or review. Retaining its progress."
          fi
      - name: Resume verification of the existing archive PR
        if: steps.existing.outputs.number != '' && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_PR_NUMBER: ${{ steps.existing.outputs.number }}
        run: node scripts/merge-telegram-capture.mjs
      - name: Verify collector contracts offline
        if: steps.existing.outputs.skip != 'true'
        run: node scripts/verify-telegram.mjs && node scripts/verify-telegram-publishing.mjs
      - name: Read latest validated artifact for the daily repository backup
        if: steps.existing.outputs.skip != 'true'
        run: node scripts/telegram-artifact.mjs restore public/data/telegram-posts.json public/data/telegram-posts.json
      - name: Open archive update PR
        if: steps.existing.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        id: archive
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: codex/telegram-capture
          base: main
          add-paths: public/data/telegram-posts.json
          commit-message: Refresh retained Telegram archive and collection health
          title: Refresh retained Telegram archive
          body: |
            Update the retained public Telegram archive with original publication dates, visible text,
            Telegram-only post links, collection health and resumable history progress.

            The workflow dispatches Verify on this PR's exact commit before merging. Any review
            feedback or required review gate leaves the PR open. No manual production operations.
      - name: Verify and merge the archive PR
        if: steps.archive.outputs.pull-request-number != ''
        env:
          TELEGRAM_PR_NUMBER: ${{ steps.archive.outputs.pull-request-number }}
        run: node scripts/merge-telegram-capture.mjs
