name: Mutual Fund disclosure capture
run-name: Mutual Fund capture · ${{ inputs.source || github.event_name }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mutual-funds-refresh.yml'
      - 'worker/mutual-funds*.mjs'
      - 'scripts/*mutual-funds*.mjs'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Collection trigger
        type: string
        default: manual
permissions:
  contents: read
  id-token: write
concurrency:
  group: mutual-fund-disclosures
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/collect-mutual-funds.mjs --bootstrap
  collect:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAMILY_HOLDINGS_LIVE: 'true'
      AMFIBEAS_REVISION: c1b611828606f01397b7283294fa1672a4fdabfa
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Set isolated source directory
        run: echo "AMFIBEAS_PATH=$RUNNER_TEMP/amfibeas" >> "$GITHUB_ENV"
      # Dependency runtime belongs to the supplied data project, not this static app.
      - name: Read AmfiBeas source data and reviewed public-disclosure parsers
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/techmuns/AmfiBeas.git "$AMFIBEAS_PATH"
          git -C "$AMFIBEAS_PATH" sparse-checkout set scripts/ingest/amc-factsheets src/data/portfolio-tracker public/amc-holdings
          git -C "$AMFIBEAS_PATH" fetch --depth 1 origin "$AMFIBEAS_REVISION"
          git -C "$AMFIBEAS_PATH" checkout FETCH_HEAD -- scripts/ingest/amc-factsheets package.json package-lock.json
          npm ci --prefix "$AMFIBEAS_PATH" --ignore-scripts
      - name: Check published AMC disclosures
        id: sources
        # A terminated source check still publishes every completed checkpoint below.
        continue-on-error: true
        run: timeout 35m "$AMFIBEAS_PATH/node_modules/.bin/tsx" scripts/refresh-mutual-funds-sources.mjs
      - name: Refresh company shares outstanding
        if: always() && steps.sources.outcome != 'skipped'
        run: node scripts/collect-mutual-funds-denominators.mjs
      - name: Publish retained holdings and coverage
        if: always() && steps.sources.outcome != 'skipped'
        run: node scripts/collect-mutual-funds.mjs --publish
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutual-fund-coverage
          path: |
            artifacts/mutual-funds-health.json
            artifacts/mutual-funds-denominators.json
            ${{ runner.temp }}/amfibeas/public/amc-holdings/sattva-checks.json
          if-no-files-found: warn
          retention-days: 30
