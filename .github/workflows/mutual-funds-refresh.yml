name: Mutual Fund disclosure capture
run-name: Mutual Fund capture · ${{ inputs.source || github.event_name }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mutual-funds-refresh.yml'
      - 'worker/mutual-funds*.mjs'
      - 'scripts/*mutual-funds*.mjs'
      - 'scripts/lib/mutual-funds*.mjs'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Collection trigger
        type: string
        default: manual
permissions:
  contents: write
  id-token: write
concurrency:
  group: mutual-funds-github-state
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FAMILY_HOLDINGS_LIVE: 'true'
      GITHUB_TOKEN: ${{ github.token }}
      MF_STATE_KEY: ${{ secrets.MF_STATE_KEY || secrets.FAMILY_HOLDINGS_TOKEN || secrets.GLOWVENTURES_READ_TOKEN }}
      MF_LOCAL_FILE: .cache/mutual-funds/state.sqlite
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore retained data on the GitHub runner
        id: restore
        timeout-minutes: 45
        run: node scripts/mutual-funds-github.mjs restore
      - name: Set isolated source directory
        run: echo "AMFIBEAS_PATH=$RUNNER_TEMP/amfibeas" >> "$GITHUB_ENV"
      - name: Read verified AmfiBeas source snapshots
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/techmuns/AmfiBeas.git "$AMFIBEAS_PATH"
          git -C "$AMFIBEAS_PATH" sparse-checkout set public/amc-holdings src/data/portfolio-tracker
          echo "AMFIBEAS_REVISION=$(git -C "$AMFIBEAS_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify shared source inventory and snapshot checksums
        id: sources
        run: node scripts/read-mutual-funds-feed.mjs
      - name: Refresh company shares outstanding
        if: steps.sources.outcome == 'success'
        continue-on-error: true
        run: timeout 5m node scripts/collect-mutual-funds-denominators.mjs
      - name: Publish retained holdings and coverage
        if: steps.sources.outcome == 'success'
        timeout-minutes: 25
        run: node scripts/collect-mutual-funds.mjs --publish
      - name: Save retained data and prepared reader snapshots to GitHub
        if: always() && steps.restore.outcome == 'success'
        timeout-minutes: 15
        run: node scripts/mutual-funds-github.mjs publish
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutual-fund-coverage
          path: |
            artifacts/mutual-funds-health.json
            artifacts/mutual-funds-denominators.json
            artifacts/mutual-funds-share-count-checks.json
            artifacts/mutual-funds-source.json
          if-no-files-found: warn
          retention-days: 30
