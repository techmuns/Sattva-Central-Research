name: Corporate actions refresh

# Official NSE exchange-wide action calendar. One rolling snapshot covers every portfolio and
# watchlist symbol, including symbols added after the capture was made.
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run — auto, button, or manual"
        required: false
        default: "manual"

run-name: Corporate actions refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

concurrency:
  group: corporate-actions-refresh
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch NSE corporate actions
        run: node scripts/scrape-corporate-actions.mjs

      - name: Verify corporate actions contract
        run: node scripts/verify-corporate-actions.mjs public/data/corporate-actions.json

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corporate-actions
          path: public/data/corporate-actions.json
          if-no-files-found: error

      - name: Commit corporate actions to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/corporate-actions.json
          if git diff --cached --quiet; then
            echo "No corporate action changes to commit."
            exit 0
          fi
          git commit -m "Corporate actions refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push failed after 4 attempts."
          exit 1
