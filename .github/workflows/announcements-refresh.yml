name: Corporate announcements refresh

# BSE date-indexed announcements for the exchange. Successful windows overlap and recover gaps
# after missed runs. Monthly archives retain rows before the recent display window trims them.

on:
  schedule:
    # All days. Recovery starts at the last completed window if a run was missed.
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to fetch (default 1)"
        required: false
        default: "1"
      keepDays:
        description: "How many days the committed file keeps (default 3)"
        required: false
        default: "3"
      source:
        description: "Who asked for this run — auto, button, or manual"
        required: false
        default: "manual"

run-name: Corporate announcements refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

# One at a time — two runs would race on the same committed file.
concurrency:
  group: announcements-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No secret of any kind. BSE's announcement feed is open, which is half the reason this
      # replaced an upstream whose session JWT expired on days nobody had changed anything.
      - name: Fetch corporate announcements
        env:
          ANN_DAYS: ${{ github.event.inputs.days || '1' }}
          ANN_KEEP_DAYS: ${{ github.event.inputs.keepDays || '3' }}
        run: node scripts/scrape-bse-announcements.mjs

      - name: Upload announcements (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corp-announcements
          path: |
            public/data/corp-announcements.json
            public/data/announcements-archive/
          if-no-files-found: warn

      # `if: success()` matters here. The scraper exits non-zero when it collected nothing across
      # every category — which means the REQUEST was wrong, not that the exchange was quiet — and
      # committing then would replace a good file with an empty one that still looks valid.
      - name: Commit announcements to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/corp-announcements.json public/data/announcements-archive/
          if git diff --cached --quiet; then
            echo "No announcement changes to commit."
            exit 0
          fi
          git commit -m "Corporate announcements refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push failed after 4 attempts."
          exit 1

      # Run after snapshot publication: a bad source must mark the job failed without discarding
      # useful rows and checkpoints already collected by the successful capture steps.
      - name: Check operational capture health
        if: always()
        env:
          FILINGS_HEALTH_REPORT: ${{ runner.temp }}/filings-health.json
        run: node scripts/check-filings-health.mjs announcements

      - name: Upload capture health report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: filings-health
          path: ${{ runner.temp }}/filings-health.json
          if-no-files-found: warn
