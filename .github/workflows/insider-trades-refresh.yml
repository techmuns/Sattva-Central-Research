name: Filings coverage refresh

# Insider trades, domestic documents and additional company announcements share one paced job.
# Every pass saves company checkpoints; the next pass resumes unfinished coverage.
# The complete insider snapshot is reused for 18 hours; partial captures remain retryable.

on:
  schedule:
    # All days, including weekend announcements and document uploads.
    - cron: "30 */2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run — auto, button, or manual"
        required: false
        default: "manual"

run-name: Insider trades refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

concurrency:
  group: insider-trades-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Capture insider trades
        run: FILINGS_SCOPE=universe FILINGS_MIN_INTERVAL_HOURS=18 FILINGS_TIMEOUT_MS=25000 node scripts/scrape-filings.mjs insider

      - name: Capture company announcements and domestic filings
        if: ${{ !cancelled() }}
        run: node scripts/capture-company-filings.mjs

      - name: Upload insider-trades data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: insider-trades-data
          path: |
            public/data/insider-trades.json
            public/data/insider-archive/
            public/data/filing-capture/
          if-no-files-found: warn

      - name: Commit insider trades to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/insider-trades.json public/data/insider-archive/ public/data/filing-capture/
          if git diff --cached --quiet; then
            echo "No insider-trades changes to commit."
            exit 0
          fi
          git commit -m "Insider trades refresh ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      # Run after snapshot publication: a bad source must mark the job failed without discarding
      # useful rows and checkpoints already collected by the successful capture steps.
      - name: Check operational capture health
        if: always()
        env:
          FILINGS_HEALTH_REPORT: ${{ runner.temp }}/filings-health.json
        run: node scripts/check-filings-health.mjs company insider

      - name: Upload capture health report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: filings-health
          path: ${{ runner.temp }}/filings-health.json
          if-no-files-found: warn
