name: Filings and four-category trades refresh

env:
  FAMILY_HOLDINGS_LIVE: 'true'

# The four Screener lists run every 30 minutes and always run first. The slower company-filings
# checkpoint keeps its two-hour cadence without delaying ordinary trade refreshes. Screener is
# incremental after a 30-day bootstrap and publishes only when all four lists parse successfully.

on:
  schedule:
    # Offset from the top of the hour, when GitHub's shared scheduler is busiest. The dashboard's
    # watchdog dispatches this same workflow when a scheduled run is late.
    - cron: "17,47 * * * *"
    # Preserve the existing company-filings capture without putting it on the 30-minute cadence.
    - cron: "30 */2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run — auto, button, or manual"
        required: false
        default: "manual"

run-name: Insider trades refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

concurrency:
  group: insider-trades-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned Screener browser client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/screener-browser" --no-save --package-lock=false playwright-core@1.62.1
          test -x "$(command -v google-chrome)"
          echo "SCREENER_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Capture all four Screener trade categories
        id: insider
        timeout-minutes: 45
        if: ${{ !cancelled() }}
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/screener-browser/node_modules/playwright-core
          # Browser diagnostics can include form values and cookies. Keep them disabled.
          DEBUG: ""
          PWDEBUG: ""
        run: node scripts/scrape-screener-trades.mjs

      - name: Capture company announcements and domestic filings
        id: company
        if: ${{ !cancelled() && github.event_name == 'schedule' && github.event.schedule == '30 */2 * * *' }}
        timeout-minutes: 25
        run: node scripts/capture-company-filings.mjs

      - name: Upload insider-trades data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: insider-trades-data
          path: |
            public/data/insider-trades.json
            public/data/insider-archive/
            public/data/filing-capture/
          if-no-files-found: warn

      - name: Commit filing and trade captures to main
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (steps.company.outcome == 'success' || steps.insider.outcome == 'success') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/insider-trades.json public/data/insider-archive/ public/data/filing-capture/
          if git diff --cached --quiet; then
            echo "No insider-trades changes to commit."
            exit 0
          fi
          git commit -m "Insider trades refresh ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      # Run after snapshot publication: a bad source must mark the job failed without discarding
      # useful rows and checkpoints already collected by the successful capture steps.
      - name: Check trade capture health
        if: ${{ always() && steps.company.outcome == 'skipped' }}
        env:
          FILINGS_HEALTH_REPORT: ${{ runner.temp }}/filings-health.json
        run: node scripts/check-filings-health.mjs insider

      - name: Check filing and trade capture health
        if: ${{ always() && steps.company.outcome != 'skipped' }}
        env:
          FILINGS_HEALTH_REPORT: ${{ runner.temp }}/filings-health.json
        run: node scripts/check-filings-health.mjs company insider

      - name: Upload capture health report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: filings-health
          path: ${{ runner.temp }}/filings-health.json
          if-no-files-found: warn
