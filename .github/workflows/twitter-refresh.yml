name: Twitter refresh

# Posts from the X/Twitter accounts in public/data/twitter-handles.json, captured on a schedule and
# committed like every other feed here. The browser reads the committed file; nothing in the app
# talks to x.com.
#
# WHY AN ACTION RATHER THAN A WORKER ROUTE — the same answer as the market-news feed. x.com is not
# readable from a browser (no CORS, and it needs a logged-in session) or from a Cloudflare Worker,
# and the retrieval library asked for is Python. A normal runner is the only reader that works.
#
# A DISPATCH MAY NAME ONE HANDLE. The dashboard's "Add Handle" control sends it, so an account
# somebody just added is read now rather than at the next scheduled run. It is validated on the
# Worker against X's own rule before it ever reaches this file, and again in the scraper.

on:
  schedule:
    # Half-hourly. GitHub's scheduler is best-effort and sheds the densest crons first — measured
    # elsewhere in this repository at 12 fired out of 124 scheduled for a */20 — so this asks for a
    # cadence it might actually get rather than one that looks impressive in the file.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      handle:
        description: "A handle to add and read immediately (optional)"
        required: false
        default: ""
      source:
        description: "Who asked for this run — cron, auto, button, or manual"
        required: false
        default: "manual"

run-name: Twitter refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }}${{ inputs.handle && format(' · @{0}', inputs.handle) || '' }})

concurrency:
  group: twitter-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The ONE pip install in this repository, and it is confined to this runner: nothing in
      # public/, in the Worker or in the Node scripts depends on Python. See the header of
      # scripts/scrape-twitter.py for why this is the exception to the no-dependencies rule.
      - name: Install twscrape
        run: pip install --quiet -r scripts/requirements-twitter.txt

      # EXIT CODES ARE THE INTERFACE.
      #   0  read what it could and wrote a capture
      #   2  every handle was unreadable — the file is untouched, which
      #      is not a fault in this repository and must not be a red build
      #   3  no usable X session, including expired cookies or rate limiting,
      #      reported as a warning so the operator sees it without the run failing every 30 minutes
      #   1  a real fault: the library changed, the runner broke, this code is wrong
      - name: Collect posts
        id: collect
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_ACCOUNTS: ${{ secrets.X_ACCOUNTS }}
          TWS_PROXY: ${{ secrets.TWS_PROXY }}
          TWS_TELEMETRY: "0"
          TWITTER_ADD: ${{ github.event.inputs.handle || '' }}
        run: |
          set +e
          python3 scripts/scrape-twitter.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Collector exit code: $code (0 = completed, check post counts; 1 = code fault; 2 = unreadable; 3 = no usable session)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Branch verification only: no capture will be committed or published." >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          if [ "$code" = "2" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=No account could be read::The committed capture is unchanged."
            exit 0
          fi
          if [ "$code" = "3" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=No usable X session::Set or renew X_COOKIES (auth_token=...; ct0=...). It takes precedence over X_ACCOUNTS password login. X may reject or rate-limit a session; TWS_PROXY is optional if the runner is blocked. The committed capture is unchanged."
            exit 0
          fi
          exit $code

      - name: Commit the capture
        if: success() && steps.collect.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/twitter-posts.json public/data/twitter-handles.json
          if git diff --cached --quiet; then
            echo "No new posts."
            exit 0
          fi
          git commit -m "Twitter refresh ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
