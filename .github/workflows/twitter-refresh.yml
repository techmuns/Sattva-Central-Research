name: Twitter refresh

# Posts from the X/Twitter accounts in public/data/twitter-handles.json, captured on a schedule and
# committed like every other feed here. The browser reads the committed file; nothing in the app
# talks to x.com.
#
# Own-session collection can be opted out with X_CAPTURE_ENABLED=false. Core research never
# depends on a scraping login. A blocked sign-in is recorded honestly; no proxy/account rotation.
#
# A DISPATCH MAY NAME ONE HANDLE. The dashboard's "Add Handle" control sends it, so an account
# somebody just added is read now rather than at the next scheduled run. It is validated on the
# Worker against X's own rule before it ever reaches this file, and again in the scraper.

on:
  schedule:
    # Half-hourly. GitHub's scheduler is best-effort and sheds the densest crons first — measured
    # elsewhere in this repository at 12 fired out of 124 scheduled for a */20 — so this asks for a
    # cadence it might actually get rather than one that looks impressive in the file.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      handle:
        description: "A handle to add and read immediately (optional)"
        required: false
        default: ""
      source:
        description: "Who asked for this run — cron, auto, button, or manual"
        required: false
        default: "manual"

run-name: Twitter refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }}${{ inputs.handle && format(' · @{0}', inputs.handle) || '' }})

concurrency:
  group: twitter-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        if: vars.X_CAPTURE_ENABLED != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The ONE pip install in this repository, and it is confined to this runner: nothing in
      # public/, in the Worker or in the Node scripts depends on Python. See the header of
      # scripts/scrape-twitter.py for why this is the exception to the no-dependencies rule.
      - name: Install twscrape
        if: vars.X_CAPTURE_ENABLED != 'false'
        run: pip install --quiet twscrape==0.20.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prepare every active portfolio identity search
        if: vars.X_CAPTURE_ENABLED != 'false'
        env:
          FAMILY_HOLDINGS_LIVE: 'true'
        run: node scripts/prepare-twitter-search.mjs

      # 0 = completed (possibly partial); 2 = failed reads with retained data; 3 = no sign-in.
      # Preserve status and retained posts before reporting unexpected collector failures.
      - name: Collect posts
        id: collect
        if: vars.X_CAPTURE_ENABLED != 'false'
        env:
          X_ACCOUNTS: ${{ secrets.X_ACCOUNTS }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          TWITTER_ADD: ${{ github.event.inputs.handle || '' }}
        run: |
          set +e
          python3 scripts/scrape-twitter.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record optional collection status
        env:
          X_CAPTURE_ENABLED: ${{ vars.X_CAPTURE_ENABLED != 'false' && 'true' || 'false' }}
          TWITTER_EXIT_CODE: ${{ steps.collect.outputs.code }}
        run: node scripts/record-twitter-status.mjs

      - name: Commit the capture
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/twitter-posts.json public/data/twitter-handles.json
          for file in public/data/twitter-search-plan.json public/data/twitter-search.json public/data/twitter-archive; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No new posts."
            exit 0
          fi
          git commit -m "Twitter refresh ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report unexpected collector failure
        if: vars.X_CAPTURE_ENABLED != 'false' && steps.collect.outputs.code != '0' && steps.collect.outputs.code != '2' && steps.collect.outputs.code != '3'
        run: exit 1
