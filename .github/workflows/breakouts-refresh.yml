name: Breakout price and volume capture
run-name: Breakout capture · ${{ inputs.source || github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/breakouts-refresh.yml'
      - 'scripts/collect-breakouts.mjs'
      - 'scripts/lib/breakout-*.mjs'
      - 'scripts/lib/breakouts-github.mjs'
      - 'worker/upstox*.mjs'
      - 'worker/breakout*.mjs'
      - 'worker/capture-registry-object.mjs'
      - 'worker/index.js'
      - 'wrangler.jsonc'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Who requested collection
        default: manual
        type: string

concurrency:
  group: breakout-market-capture
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BACKGROUND_STATE_KEY: ${{ secrets.MF_STATE_KEY || secrets.FAMILY_HOLDINGS_TOKEN || secrets.GLOWVENTURES_READ_TOKEN }}
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      UPSTOX_BACKUP_ENABLED: ${{ vars.UPSTOX_BACKUP_ENABLED }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The active runner captures minutes independently of the slower fallback
      # walk. One waiting invocation is sufficient: all captured rows are retained
      # in the acknowledged archive; superseded pending triggers carry no data.
      - name: Restore history, collect quotes and publish prepared files on GitHub
        run: node scripts/collect-breakouts.mjs
