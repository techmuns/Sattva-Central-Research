name: Technical history recovery
run-name: Technical history recovery · ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-history-recovery.yml'
      - 'scripts/repair-technical-history.mjs'
      - 'scripts/lib/technical-recovery.mjs'
      - 'scripts/lib/yahoo.mjs'
      - 'scripts/scrape-technicals.mjs'
  schedule:
    - cron: '7,37 2-13 * * 1-5'
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: ['Data refresh', 'Breakout price and volume capture']
  workflow_dispatch:

# Share ownership of the technicals file with the existing daily scraper and
# move verifier. This public, free runner never calls Cloudflare or Upstox.
concurrency:
  group: data-refresh
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Repair only missing or overdue company histories
        run: node scripts/repair-technical-history.mjs
      - name: Publish repaired history and durable cooldowns
        id: publish
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/technicals.json
          if [ -f public/data/technical-history-recovery.json ]; then
            git add public/data/technical-history-recovery.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Recover missing technical history ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
      # Ordinary progress is already retained in Git. Keep an artifact only when
      # publication failed; empty timer checks must not consume artifact storage.
      - name: Retain unpublished progress
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: technical-history-checkpoint
          path: |
            public/data/technicals.json
            public/data/technical-history-recovery.json
          if-no-files-found: warn
