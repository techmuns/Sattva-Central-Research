name: Data refresh

# The dashboard's committed baselines. The full capture runs at 07:00 IST. Company news, insider
# trades and corporate announcements have separate workflows so a slow per-company walk cannot
# race with or block end-of-day market data:
#
#   scrape-technicals.mjs        ~400 calendar days of OHLCV for the NSE 500 from Yahoo, plus
#                                NSE bhavcopy delivery %, recomputed into every indicator.
#   scrape-portfolio-history.mjs 3 years of daily closes for the portfolio's tickers and the
#                                Nifty 500 — the equity curve the Drawdown view is built from.
#   scrape-earnings.mjs          the Moneycontrol results snapshot + the scID -> NSE ticker map.
#   scrape-result-returns.mjs    the close on each result date, the base of "Return since result".
#   scrape-calendar.mjs          the results calendar — who is SCHEDULED to report, and when.
#   scrape-concalls.mjs          the StockScans con-call scan — first paint + the Worker's fallback.
#   scrape-super-investors.mjs   every super-investor's book, in one file. NOT a fallback: this is
#                                what the Superstar Investors grid is painted FROM, because the
#                                live view is one request per investor and ninety-one round trips
#                                is most of a minute on any device that has not been here before.
# The super-investor capture needs no secret here. It reads this dashboard's own Worker, which
# holds the bearer token the upstream wants — see the header of its script.
#
# NOTE ON THE EARNINGS FEED: the Earnings Hub does not wait for this. It reads /api/earnings,
# which proxies Moneycontrol live behind a 30s edge cache, so a company that files at 14:32 is on
# screen by ~14:33 with no Action run involved. What this job commits is the SNAPSHOT — the first
# paint, and the fallback the Worker serves when the upstream is unreachable. Scheduling it more
# often would not make the tab fresher; it would only shorten how stale the fallback can be.
#
# NOTE ON THE CALENDAR: this one is NOT merely a fallback. The per-date counts are live from
# Moneycontrol's JSON API, but the company list for a date exists only inside the calendar page's
# server-rendered HTML, and that page is behind Akamai — it answers a Cloudflare Worker with a 200
# carrying no data at all, while answering an ordinary client (this runner) normally. So the
# capture taken here IS the list most readers see, and the UI labels it "Captured" with its age
# rather than passing it off as a live read.
#
# Commits technicals.json, atr-history.json, portfolio-history.json, earnings-live.json,
# mc-ticker-map.json, result-returns.json and earnings-calendar.json back to main.
#
# The ATR accumulator only grows when this runs, so a missed day is a missed data point for
# the ATR-trend half of the ATR Stability rule — the rule degrades to scoring on the absolute
# level alone and says so, rather than guessing.

on:
  schedule:
    # Full daily capture: previous-session closing data before the next market opens.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run — auto, button, or manual"
        required: false
        default: "manual"

run-name: Data refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

# Only one refresh in flight at a time — concurrent runs would race on committed snapshots.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run technicals scraper
        run: node scripts/scrape-technicals.mjs

      # The portfolio equity curve is built from real daily closes, so it refreshes on the
      # same schedule. It is a dozen tickers rather than 535, so it adds well under a minute.
      # `continue-on-error` because a portfolio-history failure must not throw away a
      # successful technicals scrape — the technicals feed is the one the whole dashboard
      # depends on, and this step's own failures are recorded inside its output file anyway.
      - name: Run portfolio history scraper
        continue-on-error: true
        run: node scripts/scrape-portfolio-history.mjs

      # The results snapshot + ticker map. The map is incremental: it only resolves companies it
      # has never seen, so a normal run costs a handful of requests rather than 1,300.
      - name: Run earnings snapshot + ticker map
        continue-on-error: true
        run: node scripts/scrape-earnings.mjs

      # Result-day closes, also incremental — one Yahoo call per newly-reported company. A past
      # close never changes, so nothing already cached is refetched.
      - name: Run result-day closes
        continue-on-error: true
        run: node scripts/scrape-result-returns.mjs

      # The results calendar. Runs after the ticker map so the rows it captures can be joined to
      # NSE tickers without re-resolving what the map already knows. ~15 page fetches for a
      # three-week window, since only dates with companies on them are fetched at all.
      - name: Run results calendar capture
        continue-on-error: true
        run: node scripts/scrape-calendar.mjs

      # The con-call scan snapshot. Like the earnings one, this is NOT what makes the tab fresh —
      # the tab is live off /api/concalls, which re-reads StockScans' newest page every 30s. This
      # only bounds how stale the first paint and the fallback can be. ~18 requests.
      - name: Run con-call scan snapshot
        continue-on-error: true
        run: node scripts/scrape-concalls.mjs

      # Every super-investor's book. It reads THIS DASHBOARD'S OWN WORKER rather than Finology —
      # the upstream needs a bearer token and that token lives on the Worker and nowhere else, so
      # this job needs no secret at all. ~91 requests against a six-hour edge cache, so most of
      # them are cache reads. Shareholding data moves once a quarter; running it daily only bounds
      # how stale the committed copy can be.
      #
      # It refuses to write below 80% coverage, so a bad run leaves the previous snapshot in place
      # rather than replacing a complete file with a mostly-empty one.
      - name: Run super-investor snapshot
        continue-on-error: true
        run: node scripts/scrape-super-investors.mjs

      - name: Upload technicals data (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: technicals-data
          path: |
            public/data/technicals.json
            public/data/atr-history.json
            public/data/portfolio-history.json
            public/data/earnings-live.json
            public/data/mc-ticker-map.json
            public/data/result-returns.json
            public/data/earnings-calendar.json
            public/data/concall-scans.json
            public/data/super-investors.json
          if-no-files-found: warn

      - name: Commit refreshed technicals to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/technicals.json
          [ -f public/data/atr-history.json ] && git add public/data/atr-history.json || true
          [ -f public/data/portfolio-history.json ] && git add public/data/portfolio-history.json || true
          for f in earnings-live mc-ticker-map result-returns earnings-calendar concall-scans super-investors; do
            [ -f "public/data/$f.json" ] && git add "public/data/$f.json" || true
          done
          if git diff --cached --quiet; then
            echo "No technicals changes to commit."
            exit 0
          fi
          git commit -m "Daily data refresh ($(date -u +%Y-%m-%d))"
          # Another job may have pushed while the scrape was running (it takes ~10 min).
          # Retry with a fetch + rebase between attempts rather than force-pushing.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
