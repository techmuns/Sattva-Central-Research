name: Catalyst ideas refresh

# AI Recommendations' prepared ideas: scripts/build-catalyst-ideas.mjs reads the captures this
# repository already commits (filings, results, insider and deal disclosures, investor books, broker
# calls, technicals, sector KPIs) and writes public/data/ai-catalysts.json. No network read, no model
# call, no credential beyond the repository token that commits the file. It runs after the captures
# that move it and on an hourly fallback; the script writes only when the ideas changed or the
# published copy is more than six hours old, so a quiet hour commits nothing.
# See docs/CATALYST-ENGINE.md.
on:
  workflow_run:
    workflows: ['Corporate announcements refresh', 'Filings and four-category trades refresh', 'NSE announcements refresh', 'Data refresh', 'Broker reports refresh']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

run-name: Catalyst ideas refresh (${{ github.event_name == 'workflow_run' && 'after-capture' || github.event_name == 'schedule' && 'github-cron' || 'manual' }})

concurrency:
  group: catalyst-ideas-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify the engine
        run: node scripts/verify-catalyst-engine.mjs

      - name: Build the catalyst ideas
        run: node scripts/build-catalyst-ideas.mjs

      - name: Commit the ideas to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ai-catalysts.json
          if git diff --cached --quiet; then
            echo "No catalyst idea changes to commit."
            exit 0
          fi
          git commit -m "Catalyst ideas refresh ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push failed after 4 attempts."
          exit 1
