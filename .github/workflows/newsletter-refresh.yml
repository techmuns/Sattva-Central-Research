name: Newsletter processing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsletter-refresh.yml'
      - 'scripts/collect-newsletter.mjs'
      - 'scripts/newsletter-wake-gate.mjs'
      - 'scripts/lib/newsletter-*.mjs'
      - 'worker/newsletter*.mjs'
      - 'scripts/lib/private-markets-*.mjs'
      - 'public/js/data/private-markets-shared.js'
      - 'public/js/data/private-market-funds.js'
      - 'public/js/investors/manager-images.js'
  schedule:
    - cron: '30 3 * * 1' # Private Markets Intelligence: Monday 09:00 IST
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  # A dense cron alone dropped the 19 October morning sends. Independent main-branch
  # collector completions also wake the runner; the two gates coalesce their frequency.
  workflow_run:
    workflows: [Alert pool refresh, Announcement index refresh, Corporate announcements refresh, Market news refresh, RSS news refresh, TradingView portfolio news, Family book sync, Data refresh]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Read-only history transfer and previews without model or email work
        type: boolean
        default: false
      request:
        description: Encrypted one-time newsletter request
        type: string
        required: false
permissions:
  contents: write
  actions: write
  id-token: write
jobs:
  gate:
    if: github.ref == 'refs/heads/main' && (vars.NEWSLETTER_GITHUB_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap)) && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NEWSLETTER_QUEUE_COALESCE: 'true'
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            public/js/data
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the actual newsletter clock without mail or model credentials
        id: plan
        run: node scripts/newsletter-wake-gate.mjs
  process:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: newsletter-account
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PRIVATE_MARKETS_INTELLIGENCE_ENABLED: 'true'
      FAMILY_HOLDINGS_TOKEN: ${{ secrets.FAMILY_HOLDINGS_TOKEN }}
      NEWSLETTER_PROCESSING_ENABLED: ${{ vars.NEWSLETTER_GITHUB_ENABLED == 'true' }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_DISPATCH_TOKEN: ${{ github.token }}
      BACKGROUND_STATE_KEY: ${{ secrets.MF_STATE_KEY || secrets.FAMILY_HOLDINGS_TOKEN || secrets.GLOWVENTURES_READ_TOKEN }}
      MUNS_TOKEN: ${{ secrets.NEWSLETTER_MAIL_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.NEWSLETTER_OPENAI_KEY }}
      CLAUDE_KEY: ${{ secrets.NEWSLETTER_BEDROCK_KEY }}
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      NEWSLETTER_NEWS_AI_PROVIDER: openai
      BEDROCK_REGION: ap-south-1
      BEDROCK_MODEL_ID: global.anthropic.claude-sonnet-5
      DASHBOARD_ORIGIN: https://sattva-central-research.tech-441.workers.dev
      NEWSLETTER_PRODUCT_NAME: Research Central
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore history, process due editions and publish encrypted prepared readers
        run: node scripts/collect-newsletter.mjs
