name: Private funding archive validation
on:
  push:
    branches: [codex/private-market-news]
permissions:
  contents: read
concurrency:
  group: private-funding-staging-import
  cancel-in-progress: false
jobs:
  public-source-import:
    if: github.event.head_commit.message == 'Validate public funding archive on staging'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate the public source archive at a three-second request gap
        env:
          PRIVATE_MARKET_FILE: .cache/private-market/full-capture.json
          PRIVATE_MARKET_BUDGET: "1000"
          PRIVATE_MARKET_ARCHIVE_PAGES: "1000"
        run: node scripts/collect-private-market-news.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-funding-staging-capture
          path: .cache/private-market/full-capture.json
          retention-days: 30
