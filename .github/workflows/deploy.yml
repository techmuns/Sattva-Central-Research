name: Deploy

# Build and upload on the standard GitHub runner; Cloudflare only receives the result.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
      - "scripts/github-deploy-state.mjs"
      - "scripts/lib/github-background-*.mjs"
  workflow_dispatch:
  workflow_run:
    branches: [main]
    types: [completed]
    workflows:
      - "Alert pool refresh"
      - "Announcement index refresh"
      - "Corporate announcements refresh"
      - "Breakout price and volume capture"
      - "BSE read-only access check"
      - "NSE and BSE bulk/block refresh"
      - "Company feed access check"
      - "Company news refresh"
      - "Corporate actions refresh"
      - "Family book sync"
      - "Filings operational health"
      - "Filings and four-category trades refresh"
      - "Investor exchange disclosures"
      - "IPOPlatform collection"
      - "Market news refresh"
      - "Private market news"
      - "Mutual Fund disclosure capture"
      - "Private MF Scanner capture"
      - "News publication health"
      - "News capture recovery"
      - "NSE announcements refresh"
      - "Price-move verification"
      - "RSS news refresh"
      - "Screener access check"
      - "Screener concall collection"
      - "Screener Insights collection"
      - "Private Screener summaries"
      - "Newsletter processing"
      - "Sector KPIs refresh"
      - "Data refresh"
      - "Telegram archive"
      - "Telegram collection"
      - "TradingView portfolio news"
      - "Twitter refresh"
  # GITHUB_TOKEN data commits do not trigger another push workflow.
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"

permissions:
  contents: read
  deployments: write
  actions: write

env:
  CLOUDFLARE_ACCOUNT_ID: a441977d2344922f96303859b74754d8

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check the deployment credential
        id: credential
        run: echo "available=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.credential.outputs.available == 'true'
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            worker
            public/js
      - uses: actions/setup-node@v5
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: "22"
      - name: Compare published inputs with the last successful upload
        id: plan
        if: steps.credential.outputs.available == 'true'
        run: node scripts/github-deploy-state.mjs plan
      - name: Load the complete site for a changed publication
        if: steps.plan.outputs.changed == 'true'
        run: git sparse-checkout disable
      - name: Load verified prepared reader files from GitHub
        if: steps.plan.outputs.changed == 'true'
        run: node scripts/github-deploy-state.mjs prepare
      - name: Validate the bundle
        if: steps.plan.outputs.changed == 'true'
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy
        id: upload
        if: steps.plan.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Record the actual upload result
        if: always() && steps.plan.outputs.deployment_id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.plan.outputs.deployment_id }}
          DEPLOY_OUTCOME: ${{ steps.upload.outcome }}
        run: node scripts/github-deploy-state.mjs finish
      - name: Recover an absent market-hours quote runner
        if: always() && steps.credential.outputs.available == 'true' && steps.plan.outcome != 'skipped'
        run: node scripts/check-breakout-runner.mjs
      - name: Sync Worker secrets from the GitHub secret store
        if: steps.upload.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
        run: |
          sync_one() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "· $name is not set as a GitHub secret — skipping. The page names this state honestly."
              return 0
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            echo "· $name synced to the Worker"
          }
          sync_one GH_DISPATCH_TOKEN "$GH_DISPATCH_TOKEN"
          sync_one MUNS_TOKEN "$MUNS_TOKEN"

      - name: Report actual publication
        if: always()
        env:
          AVAILABLE: ${{ steps.credential.outputs.available }}
          PLAN: ${{ steps.plan.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          PRIOR_RESULT: ${{ job.status }}
        run: |
          if [ "$AVAILABLE" != true ]; then
            echo '::warning title=GitHub deployment not configured::CLOUDFLARE_API_TOKEN is missing; this run published nothing.'
          elif [ "$PRIOR_RESULT" = success ] && [ "$PLAN" = success ] && { [ "$UPLOAD" = success ] || [ "$UPLOAD" = skipped ]; }; then
            echo '### GitHub publication check succeeded' >> "$GITHUB_STEP_SUMMARY"
            echo 'Changed Worker and prepared static files were uploaded directly; unchanged inputs were skipped. No Cloudflare build was used.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::GitHub deployment did not succeed.'
            exit 1
          fi
