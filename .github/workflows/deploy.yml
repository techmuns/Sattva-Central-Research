name: Deploy

# Build and upload on the standard GitHub runner; Cloudflare only receives the result.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: a441977d2344922f96303859b74754d8

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  secret:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        run: echo "available=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: secret
    if: needs.secret.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate the bundle
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Sync Worker secrets from the GitHub secret store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
        run: |
          sync_one() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "· $name is not set as a GitHub secret — skipping. The page names this state honestly."
              return 0
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            echo "· $name synced to the Worker"
          }
          sync_one GH_DISPATCH_TOKEN "$GH_DISPATCH_TOKEN"
          sync_one MUNS_TOKEN "$MUNS_TOKEN"


  report:
    needs: [secret, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report actual publication
        env:
          AVAILABLE: ${{ needs.secret.outputs.available }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$DEPLOY_RESULT" = success ]; then
            echo '### Published from the free GitHub Actions runner' >> "$GITHUB_STEP_SUMMARY"
            echo 'Wrangler uploaded the Worker and static assets directly; no Cloudflare build was used by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$AVAILABLE" != true ]; then
            echo '### GitHub publishing needs its deployment credential' >> "$GITHUB_STEP_SUMMARY"
            echo 'CLOUDFLARE_API_TOKEN is missing. This run published nothing. Do not disconnect the existing publish path until the credential is installed and this path is verified.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning title=GitHub deployment not configured::CLOUDFLARE_API_TOKEN is missing; this workflow published nothing.'
          else
            echo "::error::GitHub deployment did not succeed ($DEPLOY_RESULT)."
            exit 1
          fi
