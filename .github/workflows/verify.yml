name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  twitter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r scripts/requirements-twitter.txt
      - name: Verify Twitter session and capture safety (offline)
        env:
          TWS_TELEMETRY: "0"
        run: python3 scripts/verify-twitter.py

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify filings snapshot recovery
        run: node scripts/verify-filings-snapshot.mjs
      - name: Verify additive insider trades
        run: node scripts/verify-insider-trades.mjs
      - name: Verify capture watchdog
        run: node scripts/verify-capture-watchdog.mjs
      - name: Verify NSE filing history and scoped search
        run: node scripts/verify-nse-history.mjs
      - name: Syntax-check JavaScript
        run: find public/js worker scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate the Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run
