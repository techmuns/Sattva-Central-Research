name: Company news refresh

env:
  FAMILY_HOLDINGS_LIVE: 'true'

# Portfolio news is an overlapping incremental capture, including private, BSE-only and demerged
# companies which have no NSE symbol. The Sunday universe walk retains the broader company-news
# view. Both write through the same permanent portfolio archive and share one concurrency group,
# so one capture can never overwrite another while it is still running.
#
# FREE SOURCES, NOT PAID SEARCH. Until October 2026 every query here was a paid Brave Search call
# through fastapi.muns.io/tools/news-search: in September the workflow ran 10-20 times a day in each
# Central Research dashboard and the two together made roughly 200,000 paid searches. It now
# searches Google News (free, no key; NEWS_PROVIDER=google) and reads the Upstox News API (free with
# the owner's account; UPSTOX_ANALYTICS_TOKEN). Measured on 30 holdings over a week, Google found
# about as many headlines that name the company as Brave did. The owner's schedule, now that the
# searches are free: the portfolio every 2 hours, around the clock, every day (06:11, 08:11 ...
# 04:11 IST), and the complete universe in the Sunday 06:11 IST slot. Google's feed is unofficial,
# so requests are paced, a refusal pauses the walk for a minute and a second refusal stops it until
# the next walk. The `gate` job holds every other trigger (news-recovery.yml, an open dashboard, a
# Refresh click) to the same schedule: walks at least 2 hours apart and at most 14 in any 24 hours.
# Do not switch back to the paid provider or loosen the gate without the owner's agreement; see the
# standing budget requirement in AGENTS.md.

on:
  schedule:
    # Every 2 hours, around the clock, every day: 12 walks a day. Every identity query overlaps its
    # last 48 hours, so a story the search index shows late is still caught.
    # 06:11 IST Monday to Saturday: holdings.
    - cron: "41 0 * * 1-6"
    # 06:11 IST Sunday: the complete universe, holdings first.
    - cron: "41 0 * * 0"
    # 08:11, 10:11 ... 04:11 IST every day: holdings.
    - cron: "41 2-22/2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run — cron, auto, button, or manual"
        required: false
        default: "manual"
      scope:
        description: "Portfolio incremental capture, or the complete universe"
        type: choice
        options: [book, universe]
        required: false
        default: "book"
      force:
        description: "Walk even if the 2-hour gap or the 14-walks-a-day limit would skip this run"
        type: boolean
        required: false
        default: false

run-name: Company news refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

concurrency:
  group: company-news-refresh
  cancel-in-progress: false

jobs:
  gate:
    # Checkout-free and quick: decides whether this run may walk at all.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Keep search walks 2 hours apart and at most 14 a day
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          # Scheduled walks are 2 hours apart and may start late, so they only need to avoid a walk
          # that just ran. A dispatched run (open dashboard, Refresh click, news-recovery.yml) can
          # only fill in for a walk the schedule missed.
          MIN_GAP_MINUTES: ${{ github.event_name == 'schedule' && '45' || '120' }}
          MAX_WALKS: "14"
        # A run counts only when its "Capture company news" step actually started. Runs this gate
        # skipped, or that never left the queue, made no searches. Any API failure fails the
        # job, which skips the walk: an unknown budget is never spent.
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Forced manual run: walking regardless of the walk limits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          now=$(date -u +%s)
          since=$(date -u -d "@$((now - 86400))" +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/company-news-refresh.yml/runs" \
            -f per_page=100 -f created=">=${since}" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id")
          walks=0
          latest=0
          for id in $runs; do
            started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '[.jobs[] | select(.name == "scrape") | .steps[]?
              | select(.name == "Capture company news" and .status != "queued" and .status != "pending" and .conclusion != "skipped")
              | .started_at] | first // empty')
            [ -n "$started" ] || continue
            at=$(date -u -d "$started" +%s)
            [ "$at" -gt $((now - 86400)) ] || continue
            walks=$((walks + 1))
            if [ "$at" -gt "$latest" ]; then latest=$at; fi
          done
          gap=$(( (now - latest) / 60 ))
          if [ "$latest" -gt 0 ] && [ "$gap" -lt "$MIN_GAP_MINUTES" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: a company-news search walk started ${gap} minutes ago (minimum gap ${MIN_GAP_MINUTES} minutes), so this run makes no searches." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$walks" -ge "$MAX_WALKS" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: ${walks} company-news search walks already ran in the last 24 hours (limit ${MAX_WALKS}), so this run makes no searches." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "${walks} company-news search walks in the last 24 hours: walking now." >> "$GITHUB_STEP_SUMMARY"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Queued schedules/dispatches can carry an old event SHA. Start from the branch's
          # current code and capture, then reconcile again if main moves during collection.
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The gate job matches this step's name; rename both together.
      - name: Capture company news
        env:
          # Free Google News search instead of the paid Muns/Brave news API.
          NEWS_PROVIDER: google
          # The Sunday 06:11 IST schedule walks the universe. Every other run, scheduled or
          # dispatched, walks the complete portfolio.
          NEWS_SCOPE: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 0 * * 0') && 'universe' || inputs.scope || 'book' }}
        # The query ceiling bounds one run's searches even if the identity registry grows by
        # accident: a portfolio walk is about 130-200 searches and a universe walk about 620-670.
        run: |
          ceiling=300
          if [ "$NEWS_SCOPE" = universe ]; then ceiling=900; fi
          FILINGS_SCOPE="$NEWS_SCOPE" FILINGS_BUDGET_MS=1680000 NEWS_OVERLAP_HOURS=48 NEWS_MAX_QUERIES="$ceiling" node scripts/scrape-filings.mjs news

      - name: Install bounded official-document reader
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Enrich from global search, official IR pages and retained publisher feeds
        # Core search progress must still be committed when an independent enrichment source fails.
        continue-on-error: true
        env:
          # Free sources: Google News's international edition for the global search, and the
          # owner's read-only Upstox Analytics Token for Upstox News (skipped when it is not set).
          NEWS_PROVIDER: google
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          # Global queries per walk, stalest first; each is up to five reads within the step's
          # six-minute budget. Twelve walks a day at 20 queries keep Google's daily load where six
          # walks at 40 had it. Official IR pages and the retained publisher feeds are read in full.
          NEWS_DISCOVERY_MAX_QUERIES: "20"
        run: node scripts/enrich-company-news.mjs

      - name: Compact identical observations without removing source history
        run: node scripts/compact-news-data.mjs --write

      - name: Check publication capacity and browser-load headroom
        run: node scripts/check-news-capacity.mjs

      - name: Upload company-news data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: company-news-data
          path: |
            public/data/news.json
            public/data/news.parts/
            public/data/company-news/
          if-no-files-found: warn

      - name: Publish company news and check reconciled health
        if: success() && github.ref == 'refs/heads/main'
        env:
          FILINGS_HEALTH_REPORT: ${{ runner.temp }}/company-news-health.json
        run: node scripts/publish-company-news.mjs

      # Main's publisher assesses its exact committed index after preserving partial progress.
      # Non-main captures are not published, so only those may assess the original checkout.
      - name: Check company-news capture health without publication
        if: success() && github.ref != 'refs/heads/main'
        env:
          FILINGS_HEALTH_REPORT: ${{ runner.temp }}/company-news-health.json
        run: node scripts/check-filings-health.mjs news

      - name: Upload company-news health report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: company-news-health
          path: ${{ runner.temp }}/company-news-health.json
          if-no-files-found: warn
