name: Company news refresh

env:
  FAMILY_HOLDINGS_LIVE: 'true'

# Portfolio news is an overlapping incremental capture every few hours, including private,
# BSE-only and demerged companies which have no NSE symbol. The two weekday universe walks retain
# the broader company-news view. Both write through the same permanent portfolio archive and share
# one concurrency group, so one capture can never overwrite another while it is still running.

on:
  schedule:
    # Portfolio top-ups around the clock. Together with the two universe walks below, no normal gap
    # is longer than three hours; every established identity query overlaps its last 48 hours.
    - cron: "15 */3 * * *"
    # Full universe reads at 09:00 and 19:00 IST on weekdays, as before.
    - cron: "30 3 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run — cron, auto, button, or manual"
        required: false
        default: "manual"
      scope:
        description: "Portfolio incremental capture, or the complete universe"
        type: choice
        options: [book, universe]
        required: false
        default: "book"

run-name: Company news refresh (${{ github.event_name == 'schedule' && 'github-cron' || inputs.source || 'manual' }})

concurrency:
  group: company-news-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Capture company news
        env:
          # Scheduled 09:00/19:00 IST runs keep the universe fresh. Every other schedule and the
          # default manual/automatic dispatch concentrates the budget on the complete portfolio.
          NEWS_SCOPE: ${{ (github.event_name == 'schedule' && (github.event.schedule == '30 3 * * 1-5' || github.event.schedule == '30 13 * * 1-5')) && 'universe' || inputs.scope || 'book' }}
        run: FILINGS_SCOPE="$NEWS_SCOPE" FILINGS_BUDGET_MS=1680000 NEWS_OVERLAP_HOURS=48 node scripts/scrape-filings.mjs news

      - name: Upload company-news data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: company-news-data
          path: |
            public/data/news.json
            public/data/company-news/
          if-no-files-found: warn

      - name: Commit company news to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/data/company-news/
          if git diff --cached --quiet; then
            echo "No company-news changes to commit."
            exit 0
          fi
          git commit -m "Company news refresh ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
