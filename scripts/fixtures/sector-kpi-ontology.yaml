# Sector/industry -> KPI ontology. Seeded into `sector_kpis` by POST /sector-kpis/seed.
#
# sector_industry_map holds the EXACT sector and industry strings found on the
# `stocks` table - all 644 pairs, verified against it - so a ticker resolves by
# matching them directly. Do not reword them: a changed string stops matching.
#
# Adding a KPI: define it under kpi_definitions (display_name, aliases,
# unit_hints, value_type are all required), then list its key in a kpi_group.
# Its display_name is what lands in the table, and it must not repeat one of the
# global_kpis - those are added to every pair already, so a repeat is deduped
# away and the group silently loses a KPI.

